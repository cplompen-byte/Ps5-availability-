name: PS5 monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Status opslaan als die veranderd is
        run: |
          git config user.name "ps5-monitor"
          git config user.email "ps5-monitor@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Update status" && git push)
